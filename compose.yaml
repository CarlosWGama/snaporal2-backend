version: '3.8'

services:
  # Serviço da Aplicação Laravel (PHP)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ivisson-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - ivisson-network

  # Servidor Web Nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: ivisson-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - db
    networks:
      - ivisson-network

  # Banco de Dados MariaDB
  db:
    image: mariadb:11
    container_name: ivisson-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: backend
      MYSQL_USER: root
      MYSQL_PASSWORD: 
      MYSQL_ROOT_PASSWORD: 
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
    volumes:
      - ./docker/mariadb/data:/var/lib/mysql
    networks:
      - ivisson-network

# Redes Docker
networks:
  ivisson-network:
    driver: bridge
